# Tests run against H2 in MySQL compatibility mode (test-scope-only dependency).
# Production and development always use MySQL (see main application.properties).
# NON_KEYWORDS=YEAR: H2 treats `year` as a reserved data type; the flag lets the
# column name stay portable (no quoting) on both H2 and MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Tests run schema migrations V1-V6 only. V7__seed_data.sql is excluded so
# tests start from an EMPTY database and build their own fixtures. MySQL
# development/runtime applies V1-V7 (schema + seed).
spring.flyway.target=6

# @DataJpaTest slices replace the DataSource with a default embedded H2 URL
# (losing MODE=MySQL/NON_KEYWORDS=YEAR). Keep the configured test DataSource.
spring.test.database.replace=none

app.cors.allowed-origins=http://localhost:5173
