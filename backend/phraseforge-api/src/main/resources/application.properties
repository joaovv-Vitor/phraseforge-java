spring.application.name=phraseforge-api

# MySQL datasource driven by environment variables (see .env.example)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:phraseforge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:phraseforge}
spring.datasource.password=${DB_PASSWORD:phraseforge}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.forward-headers-strategy=native

# Flyway
spring.flyway.enabled=true

# Application-specific
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.issuer=${JWT_ISSUER:phraseforge}
app.auth.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
app.auth.rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:PT1M}

# Actuator
management.endpoints.web.exposure.include=health,info

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
